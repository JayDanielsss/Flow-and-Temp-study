inputs.conduction_parameter = { value = 0.54987, source = "cothran1970", location = "Table C-3, test 18", flag = "M" }
measured.tip_temperature_ratio = { value = 0.8829, source = "cothran1970", location = "Table C-4, row 18 (test)", flag = "M" }

