# Benchmark Case H3. Gas pressures and flows are not reported. Liquid-helium consumption
# (5-25 L/h) is a heat-load proxy in the research notes, not a heat load in watts.
id = "H3"
name = "Bouleau et al. 2015: closed-loop cryogenic helium, 3.2 mm Rotor"

[sources]
bouleau2015 = "E. Bouleau, P. Saint-Bonnet, F. Mentink-Vigier, H. Takahashi, J.-F. Jacquot, M. Bardet, F. Aussenac, A. Purea, F. Engelke, S. Hediger, D. Lee, G. De Paepe, \"Pushing [...] sensitivity limits using [...] with closed-loop cryogenic helium sample spinning,\" Chem. Sci. 6, 6806-6812 (2015). https://doi.org/10.1039/C5SC02819A (full text: https://pmc.ncbi.nlm.nih.gov/articles/PMC5508678/)"

[inputs]
drive_gas = { value = "helium", source = "bouleau2015", location = "Results, \"The cryostat\"", flag = "M" }
rotor_material = { value = "zirconia", source = "bouleau2015", location = "Experimental, sample preparation (some runs sapphire)", flag = "M" }
rotor_length_mm = { note = "not reported" }
rotor_diameter_mm = { value = 3.2, source = "bouleau2015", location = "Experimental, sample preparation", flag = "M" }
wall_thickness_mm = { note = "not reported" }
bearing = { value = "gas", source = "bouleau2015", location = "Results, \"The cryostat\"", flag = "M" }
drive_gas_temperature_k = { note = "lines cooled to similar temperatures; not given per operating point" }
environment_temperature_k = { note = "not reported" }
environment_pressure_bar = { note = "\"higher than atmospheric\" only" }
turbine = { note = "not reported (Fig. 1a is a schematic)" }
nozzle_count = { note = "not reported" }
nozzle_throat_mm = { note = "not reported" }
nozzle_angle_deg = { note = "not reported" }
back_pressure_bar = { note = "not reported" }

[[points]]
inputs.spin_rate_hz = { value = 25000.0, source = "bouleau2015", location = "Fig. 2 caption", flag = "M" }
measured.sample_temperature_k = { value = 90.0, source = "bouleau2015", location = "Fig. 2 caption (about 90 K)", flag = "M" }

[[points]]
inputs.spin_rate_hz = { value = 21000.0, source = "bouleau2015", location = "Fig. 4a caption", flag = "M" }
measured.sample_temperature_k = { value = 78.0, source = "bouleau2015", location = "Fig. 4a caption (about 78 K)", flag = "M" }

[[points]]
inputs.spin_rate_hz = { value = 12500.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }
measured.sample_temperature_k = { value = 50.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }

[[points]]
inputs.spin_rate_hz = { value = 13000.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }
measured.sample_temperature_k = { value = 36.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }

[[points]]
inputs.spin_rate_hz = { value = 10000.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }
measured.sample_temperature_k = { value = 55.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }

[[points]]
inputs.spin_rate_hz = { value = 5000.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }
measured.sample_temperature_k = { value = 35.0, source = "bouleau2015", location = "Figs. 3a-b, 3d, 5 captions (one of these; the research notes do not pair each value with its caption)", flag = "M" }
