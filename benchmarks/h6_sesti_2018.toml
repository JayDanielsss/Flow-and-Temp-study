# Benchmark Case H6. The sample is cooled by a liquid-helium jet at the Rotor centre; its
# temperature is reported only as an upper bound (below 6 K).
id = "H6"
name = "Sesti et al. 2018: 80 K helium Bearings and Drive Gas, sample below 6 K"

[sources]
sesti2018b = "E. L. Sesti, E. P. Saliba, N. Alaniva, A. B. Barnes, \"[...] below 6 K,\" J. [...] Reson. 295, 1-5 (2018). https://doi.org/10.1016/j.jmr.2018.07.016 (author manuscript: https://pmc.ncbi.nlm.nih.gov/articles/PMC7015119/)"

[inputs]
drive_gas = { value = "helium", source = "sesti2018b", location = "§2 Experimental", flag = "M" }
rotor_material = { value = "zirconia", source = "sesti2018b", location = "§2 Experimental", flag = "M" }
rotor_length_mm = { note = "not reported" }
rotor_diameter_mm = { value = 3.2, source = "sesti2018b", location = "§2 Experimental", flag = "M" }
wall_thickness_mm = { note = "not reported" }
bearing = { value = "gas", source = "sesti2018b", location = "§2 Experimental (helium Bearing gas)", flag = "M" }
drive_gas_temperature_k = { value = 80.0, source = "sesti2018b", location = "§2 Experimental", flag = "M" }
environment_temperature_k = { note = "not reported" }
environment_pressure_bar = { note = "not reported" }
turbine = { note = "not reported" }
nozzle_count = { note = "not reported" }
nozzle_throat_mm = { note = "not reported" }
nozzle_angle_deg = { note = "not reported" }
back_pressure_bar = { note = "not reported" }

[[points]]
inputs.spin_rate_hz = { value = 5000.0, source = "sesti2018b", location = "§2 Experimental (5000 +/- 20 Hz)", flag = "M" }
measured.sample_temperature_k = { note = "upper bound only, below 6 K" }
