# Every placeholder value used by the study. Edit here, not in code.
# Lengths in mm, temperatures in K, Spin Rate in Hz (revolutions per second).

[geometry]
bore_diameter_mm = 30.0        # Probe Bore inner diameter
tilt_angle_deg = 54.7356       # Tilt Angle, arccos(1/sqrt(3))
max_rotor_length_mm = 20.0     # Rotor Length limit, turbine included

[sweep]
rotor_length_min_mm = 5.0      # swept from here up to max_rotor_length_mm
rotor_length_step_mm = 0.5
# Nozzle geometry swept one at a time about the baseline, at max_rotor_length_mm
nozzle_counts = [1, 2, 3, 4, 6, 8, 12]
nozzle_throats_mm = [0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0]
nozzle_angles_deg = [0.0, 10.0, 20.0, 30.0, 45.0, 60.0, 75.0]

[study]
# The full study: every allowed Configuration, each over the full factorial of the grid below.
# Grid keys are Design fields; a field left out takes its value from this file. Rotor diameter
# is swept as rotor_diameter_mm, or as rotor_diameter_fraction of the largest the Probe Bore
# allows (not both; left out, it is that largest); diameters above the bore limit for a Design's
# Rotor Length and Bearing type are skipped. Supply Pressure is the one that reaches the Target
# Spin Rate, so it is not swept. cold_support_gap_mm applies only with a Cold Support,
# hub_exit_diameter_mm only to a Radial-Inflow Turbine, back_pressure_bar only when Ducted.
# Sample lengths that do not fit inside the Rotor body are skipped.
top_designs = 10               # Designs shown in the Sample Heat Load breakdown plot
constraint_map_x = "rotor_length_mm"
constraint_map_y = "rotor_diameter_mm"

[study.grid]
rotor_length_mm = [8.0, 11.0, 14.0, 17.0, 20.0]
rotor_diameter_mm = [3.0, 5.0, 7.0]
wall_thickness_mm = [0.3, 0.8]
nozzle_count = [2, 4, 8]
nozzle_throat_mm = [0.1, 0.3, 0.5]
nozzle_angle_deg = [20.0]      # one angle keeps the grid size; the Nozzle sweep covers angle
drive_gas_temperature_k = [10.0]
sample_length_mm = [5.0, 8.0]
cold_support_gap_mm = [0.01, 0.1]

[rotor]
turbine_cap_height_mm = 3.0    # placeholder; part of the Rotor Length, held at Drive Gas temperature
bottom_cap_thickness_mm = 1.0  # placeholder; solid zirconia

[stator_allowance]
# Radial, each side of the Rotor
wall_mm = 1.5
nozzle_plenum_mm = 2.0
# Axial, one end each
housing_above_turbine_cap_mm = 3.0
cold_support_plate_mm = 2.0
# Kept free between Stator and probe wall, each side
probe_wall_clearance_mm = 0.5

[environment]
gas = "helium"                 # "helium", "nitrogen" or "air": the gas the Rotor turns in
temperature_k = 1.2            # Bath vapour around the Rotor
pressure_torr = 0.2            # saturated vapour pressure of the Bath

[drive]
gas = "helium"                 # Drive Gas, also fed to the gas Bearings
drive_gas_temperature_k = 10.0
max_supply_pressure_bar = 3.77 # absolute; 40 psig at the room-temperature regulator
target_spin_rate_hz = 1000.0
discharge_coefficient = 0.8    # placeholder, no source yet
turbine_efficiency = 1.0       # placeholder: ideal Euler torque, losses not yet included

[exhaust]
# Exhaust Path: "vented" (into the probe space; Back Pressure is the environment pressure)
# or "ducted" (out through a return line at the Back Pressure below)
path = "ducted"
ducted_back_pressure_bar = 0.05  # placeholder, absolute, at the turbine exit

[turbine]
# Turbine type: "fluted_cap" or "radial_inflow"
type = "fluted_cap"

[turbine.radial_inflow]
hub_exit_diameter_mm = 3.0     # placeholder; cut from the Turbine Cap, the blades fill the ring outside it

[drag]
rotor_stator_gap_mm = 0.1      # placeholder radial gap between Rotor and Stator
accommodation_coefficient = 1.0 # placeholder: fully diffuse reflection
windage_torque_multiplier = 1.0 # 1 is the windage model as built; the Model-Form Error spreads it

[cold_support]
# Cooling path: "vapour" (Vapour Cooling alone) or "vapour_and_cold_support"
cooling_path = "vapour"
gap_mm = 0.05                  # placeholder gap from the Bottom Cap face to the Cold Support plate
gap_sweep_mm = [0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0]

[bearing]
# Bearing type: "gas", "mechanical" or "two_center_pivot"
type = "two_center_pivot"
pivot_to_bath = false          # lower pivot tied to the Bath by contact; two-center pivots only

[bearing.gas]
journal_length_mm = 3.0        # placeholder, per journal; two journals
clearance_mm = 0.01            # placeholder radial film clearance
gas_temperature_k = 10.0       # placeholder: fed from the Drive Gas supply
supply_pressure_bar = 2.0      # placeholder, absolute
mass_flow_kg_s = 1e-7          # placeholder, both journals together
stiffness_coefficient = 0.5    # placeholder: K = coefficient (p_s - p_a) L D / clearance
radial_space_mm = 1.0          # placeholder feed plenum and journal sleeve, each side

[bearing.mechanical]
friction_coefficient = 0.01    # placeholder, unlubricated; no source yet
preload_n = 1.0                # placeholder, per bearing
stiffness_n_m = 1e7            # placeholder radial stiffness, per bearing
radial_space_mm = 2.0          # placeholder race cross-section, each side

[bearing.pivot]
friction_coefficient = 0.1     # placeholder, dry zirconia on zirconia; no source yet
preload_n = 0.05               # placeholder axial preload, per pivot
tip_radius_mm = 0.5            # placeholder spherical tip radius

[design_baseline]
# Used wherever a Design leaves a value unset
nozzle_count = 4
nozzle_throat_mm = 0.3
nozzle_angle_deg = 20.0        # from the rim tangent
wall_thickness_mm = 0.5        # placeholder Rotor tube wall
sample_length_mm = 5.0         # Sample packed from the Bottom Cap upward

[thermal]
sample_zone_delta_t_k = 0.1    # Sample Zone: within this of the bath temperature
min_sample_zone_mm = 5.0
bath_cooling_power_w = 0.100
sample_internal_heat_load_w = 0.0
sample_conductivity_w_m_k = 0.1   # placeholder, no source yet
stator_temperature_k = 1.2        # placeholder: Stator held at Bath temperature
rotor_emissivity = 0.9            # placeholder, no source yet
windage_heat_to_rotor_fraction = 1.0  # placeholder: all windage heat enters the Rotor (upper bound)

[stress]
required_safety_factor = 3.0   # placeholder, on room-temperature tensile strength; no cryogenic data

[rotordynamics]
critical_speed_separation = 0.2  # no critical speed within this fraction of the Target Spin Rate
whirl_onset_ratio = 2.0          # placeholder rule of thumb: gas-bearing whirl onset / lowest rigid-body critical speed

[materials]
zirconia_conductivity_multiplier = 1.0  # Input Uncertainty range x0.3 to x3

[uncertainty]
# Monte Carlo over the Input Uncertainty, on the top-ranked Designs of the full study.
# Each sample draws every input below, then spreads the knob of each Reference Case mechanism
# by its Model-Form Error: knob x (1 + e), e normal with the mechanism's rms error as its
# standard deviation. The spread is centred, so the median stays the model as built.
samples = 200
seed = 1
designs = 10                   # top-ranked Designs (Feasible first) given bands
reference_cases = "references" # relative to this file
percentiles = [5.0, 95.0]

# Input Uncertainty: Assumptions field -> distribution, "uniform" or "log_uniform" over [low, high].
# mechanical_ and pivot_friction_coefficient set the Bearing models' friction coefficients.
[uncertainty.inputs]
zirconia_conductivity_multiplier = { distribution = "log_uniform", low = 0.3, high = 3.0 }
discharge_coefficient = { distribution = "uniform", low = 0.6, high = 0.95 }       # placeholder range
accommodation_coefficient = { distribution = "uniform", low = 0.5, high = 1.0 }    # placeholder range
mechanical_friction_coefficient = { distribution = "log_uniform", low = 0.003, high = 0.03 }  # placeholder range
pivot_friction_coefficient = { distribution = "log_uniform", low = 0.03, high = 0.3 }         # placeholder range
turbine_efficiency = { distribution = "uniform", low = 0.5, high = 1.0 }           # placeholder range

# Reference Case mechanism -> the knob its Model-Form Error spreads.
[uncertainty.model_form_knobs]
nozzle = "discharge_coefficient"
windage = "windage_torque_multiplier"
rarefied_drag = "accommodation_coefficient"
turbine = "turbine_efficiency"
conduction = "zirconia_conductivity_multiplier"

[benchmark]
# Allowed |Model-Form Error|, (predicted - measured) / measured, for each measured quantity.
[benchmark.tolerance]
supply_pressure_bar = 0.3        # placeholder, no basis yet
supply_pressure_bar_gauge = 0.3  # placeholder
mass_flow_kg_s = 0.3             # placeholder
torque_n_m = 0.5                 # placeholder
drag_power_w = 0.5               # placeholder
sample_temperature_k = 0.2       # placeholder
sample_heat_load_w = 0.5         # placeholder
bath_heat_load_w = 0.5           # placeholder
