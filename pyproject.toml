[project]
name = "rotor_design"
version = "0.1.0"
description = "Design-limit calculations for a small gas-driven rotor and turbine"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "CoolProp"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["rotor_design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Slow tests are skipped by default; run everything with: pytest -m ""
addopts = "-m 'not slow'"
markers = ["slow: runs the study end to end (minutes each); run with pytest -m slow or pytest -m \"\""]
